<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Retro Beeper Long-Text</title>
    <style>
        /* 引入多种字体以支持多语言混排 */
        @import url('https://fonts.googleapis.com/css2?family=VT323&display=swap');
        @import url('https://fonts.googleapis.com/css2?family=Courier+Prime:wght@400;700&display=swap');
        @import url('https://fonts.googleapis.com/css2?family=Noto+Sans+SC:wght@400;700&display=swap'); /* 简中 */
        @import url('https://fonts.googleapis.com/css2?family=Noto+Sans+JP:wght@400;700&display=swap'); /* 日文 */

        * {
            box-sizing: border-box;
            -webkit-tap-highlight-color: transparent;
            touch-action: none; /* 关键：接管触摸控制 */
        }

        body {
            margin: 0;
            height: 100vh;
            background-color: #2c3e50;
            /* 复古网格背景 */
            background-image: 
                linear-gradient(rgba(255,255,255,0.05) 1px, transparent 1px),
                linear-gradient(90deg, rgba(255,255,255,0.05) 1px, transparent 1px);
            background-size: 30px 30px;
            font-family: 'Courier Prime', 'Noto Sans SC', 'Noto Sans JP', monospace;
            overflow: hidden;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        /* --- 设备主体 --- */
        .device-container {
            position: relative;
            width: 320px;
            /* 高度设为自适应或固定，这里固定即可，纸张会超出 */
            height: 420px;
            display: flex;
            flex-direction: column;
            align-items: center;
            z-index: 20;
        }

        .device-top {
            width: 100%;
            height: 280px;
            background: #dcdcdc;
            border-radius: 20px 20px 5px 5px;
            z-index: 50; /* 必须比纸张高 */
            position: relative;
            display: flex;
            flex-direction: column;
            align-items: center;
            padding: 20px;
            box-shadow: 
                inset 2px 2px 5px rgba(255,255,255,0.8),
                inset -2px -2px 5px rgba(0,0,0,0.2),
                0 5px 10px rgba(0,0,0,0.3);
            border-bottom: 4px solid #aaa;
        }

        .device-bottom {
            width: 90%;
            height: 60px;
            background: #c0c0c0;
            border-radius: 0 0 20px 20px;
            z-index: 5; /* 必须比纸张低 */
            margin-top: -10px;
            box-shadow: 0 20px 40px rgba(0,0,0,0.4);
        }

        .shaking { animation: shake 0.2s infinite; }
        @keyframes shake {
            0% { transform: translate(0, 0); }
            25% { transform: translate(1px, 1px); }
            50% { transform: translate(-1px, -1px); }
            75% { transform: translate(1px, -1px); }
            100% { transform: translate(0, 0); }
        }

        .brand {
            font-family: 'VT323', monospace;
            font-size: 28px;
            color: #444;
            margin-bottom: 15px;
            letter-spacing: 3px;
            font-weight: bold;
            text-shadow: 0 1px 0 rgba(255,255,255,0.5);
        }

        .screen {
            width: 260px;
            height: 110px;
            background: #8b9bb4;
            border: 5px solid #555;
            border-radius: 6px;
            box-shadow: inset 0 0 15px rgba(0,0,0,0.4);
            padding: 10px;
            margin-bottom: 20px;
        }

        textarea {
            width: 100%;
            height: 100%;
            background: transparent;
            border: none;
            outline: none;
            font-family: 'VT323', monospace;
            font-size: 18px; /* 稍微调小字体以便输入更多 */
            color: #101010;
            resize: none;
            line-height: 1.2;
        }
        
        textarea::placeholder {
            color: #4a5a70;
            font-size: 16px;
        }

        .controls {
            display: flex;
            gap: 15px;
            width: 100%;
            justify-content: center;
        }

        .btn {
            height: 50px;
            border: none;
            border-radius: 8px;
            font-family: 'VT323', monospace;
            font-size: 20px;
            cursor: pointer;
            color: white;
            box-shadow: 0 4px 0 rgba(0,0,0,0.4);
            transition: transform 0.1s, box-shadow 0.1s;
        }
        .btn:active { transform: translateY(4px); box-shadow: none; }
        .btn-print { background: #e74c3c; width: 120px; }
        .btn-clear { background: #7f8c8d; width: 60px; }

        .slot-visual {
            position: absolute;
            bottom: 0;
            left: 50%;
            transform: translateX(-50%);
            width: 240px;
            height: 8px;
            background: #222;
            border-radius: 4px 4px 0 0;
        }

        /* --- 纸张样式 --- */
        .paper {
            position: absolute;
            width: 230px; /* 稍微加宽 */
            background: #fffdf0;
            color: #222;
            /* 内边距：上 左右 下(多留点给锯齿) */
            padding: 20px 15px 30px 15px; 
            font-size: 13px; /* 适合阅读长文的大小 */
            line-height: 1.5;
            box-shadow: 0 5px 15px rgba(0,0,0,0.15);
            
            /* 文本处理 */
            white-space: pre-wrap; /* 保留用户输入的换行符 */
            word-wrap: break-word; /* 防止长单词撑破 */
            font-weight: bold;
            
            /* 初始定位 */
            left: 50%;
            top: 270px; 
            transform: translateX(-50%);
            
            z-index: 10; 
            opacity: 0;
            /* 动画过渡 */
            transition: top 2s linear, opacity 0.2s;
        }

        .paper.printing {
            opacity: 1;
        }

        .paper.sticker {
            cursor: grab;
            z-index: 100;
            box-shadow: 5px 10px 20px rgba(0,0,0,0.2);
            transition: transform 0.2s;
        }
        
        .paper.sticker:active {
            cursor: grabbing;
            transform: scale(1.02) rotate(var(--rot));
        }

        /* 锯齿边缘 */
        .paper::after {
            content: "";
            position: absolute;
            bottom: -6px;
            left: 0;
            width: 100%;
            height: 6px;
            background: radial-gradient(circle, transparent 70%, #fffdf0 75%);
            background-size: 10px 10px;
            background-position: 0 -5px;
        }

        .paper-footer {
            margin-top: 15px;
            padding-top: 10px;
            border-top: 2px dashed #ddd;
            font-size: 10px;
            color: #888;
            text-align: center;
            font-family: 'VT323', monospace;
            text-transform: uppercase;
        }

    </style>
</head>
<body>

    <div class="device-container" id="device">
        <div class="device-top">
            <div class="brand">MOTO-TEXT 5000</div>
            <div class="screen">
                <textarea id="input-text" placeholder="TYPE ANYTHING HERE...
(Supports multiline & multi-language)" maxlength="300"></textarea>
            </div>
            <div class="controls">
                <button class="btn btn-clear" onclick="clearInput()">CLR</button>
                <button class="btn btn-print" onclick="printReceipt()">PRINT</button>
            </div>
            <div class="slot-visual"></div>
        </div>
        <div class="device-bottom"></div>
    </div>

    <script>
        const device = document.getElementById('device');
        const input = document.getElementById('input-text');
        let isPrinting = false;

        function clearInput() {
            input.value = "";
            input.focus();
        }

        function printReceipt() {
            // 获取原文，不去掉换行符
            const text = input.value;
            
            if (!text.trim()) {
                device.classList.add('shaking');
                setTimeout(() => device.classList.remove('shaking'), 200);
                return;
            }
            
            if (isPrinting) return;
            isPrinting = true;
            device.classList.add('shaking');

            const paper = document.createElement('div');
            paper.classList.add('paper');
            
            // 生成内容：直接显示用户输入的文本 + 底部时间戳
            const timeStr = new Date().toLocaleString();
            paper.innerHTML = `
                <div>${text}</div>
                <div class="paper-footer">${timeStr}</div>
            `;

            // --- 关键逻辑：动态计算高度 ---
            // 1. 先把纸张放到 DOM 里（此时它是透明的 opacity:0）
            //    我们需要把它放到 DOM 里才能计算出有了这堆文字后，纸到底有多长
            const rect = device.getBoundingClientRect();
            const startTop = rect.top + 270; 
            const startLeft = rect.left + (rect.width / 2);

            paper.style.top = startTop + 'px';
            paper.style.left = startLeft + 'px';
            
            document.body.appendChild(paper);
            
            // 2. 获取纸张生成的实际高度
            const paperHeight = paper.offsetHeight;
            
            // 3. 开始动画
            void paper.offsetWidth; // 强制重绘
            paper.classList.add('printing');

            // 计算需要吐出多长：纸张高度 + 一点余量(20px)让它完全离开出纸口
            // 如果纸张很短，至少也要吐出 100px
            let moveDistance = Math.max(paperHeight + 20, 100);
            
            // 动态调整打印时间：字越多打得越久，更有真实感
            // 基础 1.5秒 + 每100px高度增加 0.5秒
            const duration = 1500 + (paperHeight / 100) * 500;

            paper.style.transition = `top ${duration}ms linear`; // 使用 linear 匀速更有打印机的机械感
            paper.style.top = (startTop + moveDistance) + 'px';

            setTimeout(() => {
                device.classList.remove('shaking');
                isPrinting = false;
                input.value = ""; // 打印完清空
                
                paper.classList.add('sticker');
                
                const rot = (Math.random() * 6) - 3;
                paper.style.setProperty('--rot', rot + 'deg');
                paper.style.transform = `translateX(-50%) rotate(${rot}deg)`;
                
                // 激活拖拽
                initUniversalDrag(paper);

            }, duration);
        }

        // --- 全能拖拽函数 (鼠标 + 触摸) ---
        function initUniversalDrag(el) {
            let startX, startY, initialLeft, initialTop;

            const startDrag = (e) => {
                // 仅在非触摸设备上阻止默认，触摸设备单独处理
                if (e.type !== 'touchstart') {
                    e.preventDefault();
                }
                
                // 层级置顶
                document.querySelectorAll('.paper').forEach(p => p.style.zIndex = 100);
                el.style.zIndex = 101;

                const clientX = e.type === 'touchstart' ? e.touches[0].clientX : e.clientX;
                const clientY = e.type === 'touchstart' ? e.touches[0].clientY : e.clientY;

                startX = clientX;
                startY = clientY;
                initialLeft = el.offsetLeft;
                initialTop = el.offsetTop;

                if (e.type === 'touchstart') {
                    document.addEventListener('touchmove', moveDrag, { passive: false });
                    document.addEventListener('touchend', stopDrag);
                } else {
                    document.addEventListener('mousemove', moveDrag);
                    document.addEventListener('mouseup', stopDrag);
                }
            };

            const moveDrag = (e) => {
                // 关键：阻止屏幕滚动，让纸张跟随手指
                if(e.cancelable) e.preventDefault(); 

                const clientX = e.type === 'touchmove' ? e.touches[0].clientX : e.clientX;
                const clientY = e.type === 'touchmove' ? e.touches[0].clientY : e.clientY;

                const dx = clientX - startX;
                const dy = clientY - startY;

                el.style.left = (initialLeft + dx) + 'px';
                el.style.top = (initialTop + dy) + 'px';
            };

            const stopDrag = () => {
                document.removeEventListener('mousemove', moveDrag);
                document.removeEventListener('mouseup', stopDrag);
                document.removeEventListener('touchmove', moveDrag);
                document.removeEventListener('touchend', stopDrag);
            };

            el.addEventListener('mousedown', startDrag);
            el.addEventListener('touchstart', startDrag, { passive: false });
        }
    </script>
</body>
</html>
