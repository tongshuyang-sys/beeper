<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Retro Printer Final</title>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=VT323&display=swap');
        @import url('https://fonts.googleapis.com/css2?family=Courier+Prime:wght@400;700&display=swap');
        @import url('https://fonts.googleapis.com/css2?family=Noto+Sans+SC:wght@400;700&display=swap');
        @import url('https://fonts.googleapis.com/css2?family=Noto+Sans+JP:wght@400;700&display=swap');

        * {
            box-sizing: border-box;
            -webkit-tap-highlight-color: transparent;
        }

        body {
            margin: 0;
            /* 允许页面延伸，不再强制锁死一屏 */
            min-height: 100vh; 
            background-color: #2c3e50;
            background-image: 
                linear-gradient(rgba(255,255,255,0.05) 1px, transparent 1px),
                linear-gradient(90deg, rgba(255,255,255,0.05) 1px, transparent 1px);
            background-size: 30px 30px;
            font-family: 'Courier Prime', 'Noto Sans SC', 'Noto Sans JP', monospace;
            
            /* 关键修复：允许背景滚动 */
            overflow-y: auto; 
            overflow-x: hidden;
            
            display: flex;
            justify-content: center;
            /* 将对齐方式改为顶部对齐，防止小屏时设备被切掉 */
            align-items: flex-start; 
            padding-top: 50px; /* 顶部留白 */
            padding-bottom: 200px; /* 底部留白，给纸张足够的空间 */
        }

        .device-container {
            position: relative;
            width: 320px;
            height: 420px;
            display: flex;
            flex-direction: column;
            align-items: center;
            z-index: 20;
            /* 保证设备本身不会触发没必要的缩放 */
            flex-shrink: 0; 
        }

        .device-top {
            width: 100%;
            height: 280px;
            background: #dcdcdc;
            border-radius: 20px 20px 5px 5px;
            z-index: 50; 
            position: relative;
            display: flex;
            flex-direction: column;
            align-items: center;
            padding: 20px;
            box-shadow: 
                inset 2px 2px 5px rgba(255,255,255,0.8),
                inset -2px -2px 5px rgba(0,0,0,0.2),
                0 5px 10px rgba(0,0,0,0.3);
            border-bottom: 4px solid #aaa;
        }

        .device-bottom {
            width: 90%;
            height: 60px;
            background: #c0c0c0;
            border-radius: 0 0 20px 20px;
            z-index: 5; 
            margin-top: -10px;
            box-shadow: 0 20px 40px rgba(0,0,0,0.4);
        }

        .shaking { animation: shake 0.2s infinite; }
        @keyframes shake {
            0% { transform: translate(0, 0); }
            25% { transform: translate(1px, 1px); }
            50% { transform: translate(-1px, -1px); }
            75% { transform: translate(1px, -1px); }
            100% { transform: translate(0, 0); }
        }

        .brand {
            font-family: 'VT323', monospace;
            font-size: 28px;
            color: #444;
            margin-bottom: 15px;
            letter-spacing: 3px;
            font-weight: bold;
            text-shadow: 0 1px 0 rgba(255,255,255,0.5);
        }

        .screen {
            width: 260px;
            height: 110px;
            background: #8b9bb4;
            border: 5px solid #555;
            border-radius: 6px;
            box-shadow: inset 0 0 15px rgba(0,0,0,0.4);
            padding: 10px;
            margin-bottom: 20px;
        }

        textarea {
            width: 100%;
            height: 100%;
            background: transparent;
            border: none;
            outline: none;
            font-family: 'VT323', monospace;
            font-size: 18px;
            color: #101010;
            resize: none;
            line-height: 1.2;
        }
        
        textarea::placeholder { color: #4a5a70; font-size: 16px; }

        .controls {
            display: flex;
            gap: 15px;
            width: 100%;
            justify-content: center;
        }

        .btn {
            height: 50px;
            border: none;
            border-radius: 8px;
            font-family: 'VT323', monospace;
            font-size: 20px;
            cursor: pointer;
            color: white;
            box-shadow: 0 4px 0 rgba(0,0,0,0.4);
            transition: transform 0.1s, box-shadow 0.1s;
        }
        .btn:active { transform: translateY(4px); box-shadow: none; }
        .btn-print { background: #e74c3c; width: 120px; }
        .btn-clear { background: #7f8c8d; width: 60px; }

        .slot-visual {
            position: absolute;
            bottom: 0;
            left: 50%;
            transform: translateX(-50%);
            width: 240px;
            height: 8px;
            background: #222;
            border-radius: 4px 4px 0 0;
        }

        /* --- 纸张样式 --- */
        .paper {
            position: absolute;
            width: 230px;
            background: #fffdf0;
            color: #222;
            padding: 20px 15px 30px 15px; 
            font-size: 13px;
            line-height: 1.5;
            box-shadow: 0 5px 15px rgba(0,0,0,0.15);
            white-space: pre-wrap;
            word-wrap: break-word;
            font-weight: bold;
            
            /* 初始隐藏状态 */
            left: 50%;
            transform: translateX(-50%);
            z-index: 10; 
            opacity: 0;
            transition: top 1.5s linear, opacity 0.2s;

            /* 关键修复：只有纸张禁止浏览器默认行为（滚动），确保可以拖拽 */
            touch-action: none; 
        }

        .paper.printing { opacity: 1; }

        .paper.sticker {
            cursor: grab;
            z-index: 100;
            box-shadow: 5px 10px 20px rgba(0,0,0,0.2);
            transition: transform 0.2s;
        }
        
        .paper.sticker:active {
            cursor: grabbing;
            transform: scale(1.02) rotate(var(--rot));
        }

        .paper::after {
            content: "";
            position: absolute;
            bottom: -6px;
            left: 0;
            width: 100%;
            height: 6px;
            background: radial-gradient(circle, transparent 70%, #fffdf0 75%);
            background-size: 10px 10px;
            background-position: 0 -5px;
        }

        .paper-footer {
            margin-top: 15px;
            padding-top: 10px;
            border-top: 2px dashed #ddd;
            font-size: 10px;
            color: #888;
            text-align: center;
            font-family: 'VT323', monospace;
            text-transform: uppercase;
        }
    </style>
</head>
<body>

    <div class="device-container" id="device">
        <div class="device-top">
            <div class="brand">MOTO-TEXT 5000</div>
            <div class="screen">
                <textarea id="input-text" placeholder="TYPE HERE..." maxlength="300"></textarea>
            </div>
            <div class="controls">
                <button class="btn btn-clear" onclick="clearInput()">CLR</button>
                <button class="btn btn-print" onclick="printReceipt()">PRINT</button>
            </div>
            <div class="slot-visual"></div>
        </div>
        <div class="device-bottom"></div>
    </div>

    <script>
        const device = document.getElementById('device');
        const input = document.getElementById('input-text');
        let isPrinting = false;

        function clearInput() {
            input.value = "";
            input.focus();
        }

        function printReceipt() {
            const text = input.value;
            if (!text.trim()) {
                device.classList.add('shaking');
                setTimeout(() => device.classList.remove('shaking'), 200);
                return;
            }
            
            if (isPrinting) return;
            isPrinting = true;
            device.classList.add('shaking');

            const paper = document.createElement('div');
            paper.classList.add('paper');
            
            const timeStr = new Date().toLocaleString();
            paper.innerHTML = `<div>${text}</div><div class="paper-footer">${timeStr}</div>`;

            // 获取设备位置（因为现在页面可以滚动，所以要计算 accurately）
            const rect = device.getBoundingClientRect();
            
            // 计算初始 top 值：
            // 注意：在页面可滚动的情况下，absolute 元素的 top 是相对于 offsetParent (body) 的
            // 所以我们要加上 window.scrollY
            const deviceTopRelativeToDoc = rect.top + window.scrollY;
            const deviceLeftRelativeToDoc = rect.left + (rect.width / 2);
            
            const startTop = deviceTopRelativeToDoc + 270; 

            paper.style.top = startTop + 'px';
            paper.style.left = deviceLeftRelativeToDoc + 'px'; // 这里用JS设置初始left
            
            document.body.appendChild(paper);
            
            const paperHeight = paper.offsetHeight;
            void paper.offsetWidth; 
            paper.classList.add('printing');

            let moveDistance = Math.max(paperHeight + 20, 100);
            const duration = 1500 + (paperHeight / 100) * 500;

            // 更新动画目标 Top
            paper.style.transition = `top ${duration}ms linear`;
            paper.style.top = (startTop + moveDistance) + 'px';

            setTimeout(() => {
                device.classList.remove('shaking');
                isPrinting = false;
                input.value = "";
                
                paper.classList.add('sticker');
                const rot = (Math.random() * 6) - 3;
                paper.style.setProperty('--rot', rot + 'deg');
                paper.style.transform = `translateX(-50%) rotate(${rot}deg)`;
                
                initUniversalDrag(paper);
            }, duration);
        }

        function initUniversalDrag(el) {
            let startX, startY, initialLeft, initialTop;

            const startDrag = (e) => {
                // 触摸时：因为我们在 CSS 里对 .paper 设置了 touch-action: none
                // 浏览器会自动知道在这个元素上不要滚动页面，所以这里甚至不需要 preventDefault
                // 但为了保险起见，防止文本被选中等副作用，保留 preventDefault
                if (e.type !== 'touchstart') {
                    e.preventDefault();
                }

                // 提升层级
                document.querySelectorAll('.paper').forEach(p => p.style.zIndex = 100);
                el.style.zIndex = 101;

                const clientX = e.type === 'touchstart' ? e.touches[0].clientX : e.clientX;
                const clientY = e.type === 'touchstart' ? e.touches[0].clientY : e.clientY;

                startX = clientX;
                startY = clientY;
                initialLeft = el.offsetLeft;
                initialTop = el.offsetTop;

                if (e.type === 'touchstart') {
                    document.addEventListener('touchmove', moveDrag, { passive: false });
                    document.addEventListener('touchend', stopDrag);
                } else {
                    document.addEventListener('mousemove', moveDrag);
                    document.addEventListener('mouseup', stopDrag);
                }
            };

            const moveDrag = (e) => {
                // 阻止事件冒泡，防止触发浏览器的其他手势
                if(e.cancelable) e.preventDefault(); 

                const clientX = e.type === 'touchmove' ? e.touches[0].clientX : e.clientX;
                const clientY = e.type === 'touchmove' ? e.touches[0].clientY : e.clientY;

                const dx = clientX - startX;
                const dy = clientY - startY;

                el.style.left = (initialLeft + dx) + 'px';
                el.style.top = (initialTop + dy) + 'px';
            };

            const stopDrag = () => {
                document.removeEventListener('mousemove', moveDrag);
                document.removeEventListener('mouseup', stopDrag);
                document.removeEventListener('touchmove', moveDrag);
                document.removeEventListener('touchend', stopDrag);
            };

            el.addEventListener('mousedown', startDrag);
            el.addEventListener('touchstart', startDrag, { passive: false });
        }
    </script>
</body>
</html>
